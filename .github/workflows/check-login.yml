name: Check login status

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi==0.14.0

      - name: Run login check
        id: check
        env:
          PRIVACY_EMAIL: ${{ secrets.PRIVACY_EMAIL }}
          PRIVACY_PASSWORD: ${{ secrets.PRIVACY_PASSWORD }}
        run: python scripts/check_login.py
        continue-on-error: true

      - name: Commit status.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- status.json; then
            git add status.json
            git commit -m "atualiza status do login"
            git push
          else
            echo "status.json sem alteracao"
          fi
